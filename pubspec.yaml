name: scanbox_connect
description: "Android application for PDA/MDE barcode scanners to integrate with Homebox and other self-hosted services such as Jellyfin"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # general
  logger: ^2.6.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.6
  get: ^4.7.3
  flutter_secure_storage: ^10.3.1

  # network and internet stuff
  dio: ^5.10.0
  retrofit: ^4.9.0

  # database
  drift: ^2.34.1
  drift_flutter: ^0.3.1

  # barcode and qr code scanning
  mobile_scanner: ^7.4.0
  honeywell_scanner: ^8.0.0

  # ui
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  retrofit_generator: ^10.0.1
  drift_dev: ^2.34.2+1
  build_runner: ^2.15.0
  json_serializable: ^6.10.0


flutter:
  uses-material-design: true
