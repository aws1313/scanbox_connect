name: scanbox_connect
description: "Android application for PDA/MDE barcode scanners to integrate with Homebox and other self-hosted services such as Jellyfin"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # general
  logging: ^1.3.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  get: ^4.7.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  uuid: ^4.6.0
  collection: ^1.19.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.2
  dart_flutter_version: ^1.0.56

  # network and internet stuff
  dio: ^5.10.0
  retrofit: ^4.9.0
  pretty_dio_logger: ^1.4.0

  # database
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # barcode and qr code scanning
  mobile_scanner: ^7.4.0
  honeywell_scanner: ^8.0.0

  # ui
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  retrofit_generator: ^10.0.1
  hive_ce_generator: ^1.11.1
  build_runner: ^2.15.0
  json_serializable: ^6.10.0
  freezed: ^3.2.5


flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#673ab7"
  image: "assets/splash_logo.png"
  fullscreen: true